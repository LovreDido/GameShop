<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>GameShop | Prijava</title>
    <link rel="stylesheet" href="https://bootswatch.com/5/cyborg/bootstrap.min.css">
</head>
<body class="bg-dark">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card border-info bg-dark text-white">
                    <div class="card-header bg-info text-dark text-center"><h4>Prijava u sustav</h4></div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-info w-100 mt-3">Prijavi se</button>
                        </form>
                        <p class="mt-3 small text-center">Nemaš račun? <a href="{% url 'registracija' %}" class="text-success">Registriraj se</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
