<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>GameShop | Registracija</title>
    <link rel="stylesheet" href="https://bootswatch.com/5/cyborg/bootstrap.min.css">
</head>
<body class="bg-dark">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card border-success">
                    <div class="card-header bg-success text-black text-center">
                        <h4 class="mb-0">Kreiraj Gamer Račun</h4>
                    </div>
                    <div class="card-body bg-dark text-white">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-success w-100 mt-3">Registriraj se</button>
                        </form>
                        <div class="text-center mt-3 small">
                            Već imaš račun? <a href="{% url 'login' %}" class="text-info">Prijavi se</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
