<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Brisanje | GameShop</title>
    <link rel="stylesheet" href="https://bootswatch.com/5/cyborg/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5 text-center">
        <div class="card bg-danger p-4 shadow">
            <h2>Brisanje artikla</h2>
            <p>Jesi li siguran da želiš trajno obrisati igru: <strong>{{ igra.naslov }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-light px-5">DA, OBRIŠI</button>
                <a href="{% url 'katalog' %}" class="btn btn-outline-dark px-5">ODUSTANI</a>
            </form>
        </div>
    </div>
</body>
</html>
